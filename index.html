<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alejandro+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #1e0a29;
            --bg-secondary: #3b1d5c;
            --text-color: #e0e0e0;
            --accent-main: #ffc700;
            --accent-secondary: #7b2299;
            --border-color: #4a2c6d;
            --light-bg-primary: #e0f7f7;
            --light-bg-secondary: #b2dfdb;
            --light-text-color: #2c2c2c;
            --light-accent-main: #58d68d;
            --light-accent-secondary: #1d4872;
            --light-border-color: #cccccc;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-primary);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow: hidden;
        }

        body.light {
            background-color: var(--light-bg-primary);
            color: var(--light-text-color);
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            font-weight: bold;
            color: var(--text-color);
            transition: opacity 0.7s ease-in-out;
            z-index: 2000;
        }
        
        body.light #loading-screen {
            background-color: var(--light-bg-primary);
            color: var(--light-text-color);
        }

        .loader {
            border: 10px solid var(--border-color);
            border-top: 10px solid var(--accent-main);
            border-radius: 50%;
            width: 80px;
            height: 80px;
            animation: spin 2s linear infinite;
            margin-top: 20px;
        }
        body.light .loader {
            border: 10px solid var(--light-border-color);
            border-top: 10px solid var(--light-accent-main);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #skip-loading-btn {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 1.1em;
            cursor: pointer;
            background-color: var(--accent-main);
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        
        body.light #skip-loading-btn {
            background-color: var(--light-accent-main);
        }

        #skip-loading-btn:hover {
            background-color: #e6b800;
        }
        
        body.light #skip-loading-btn:hover {
            background-color: #49b375;
        }


        #main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            opacity: 1;
            transition: opacity 0.7s ease-in-out;
        }

        .hidden-content {
            display: none !important;
        }
        
        header {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
            color: var(--accent-main);
            letter-spacing: 2px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            font-family: 'Roboto Condensed', sans-serif;
        }
        body.light header {
            color: var(--light-accent-main);
            text-shadow: none;
        }

        main {
            display: flex;
            width: 95%;
            max-width: 1400px;
            gap: 20px;
        }

        nav.series-menu {
            width: 280px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
            max-height: 80vh;
            overflow-y: auto;
        }
        body.light nav.series-menu {
            background-color: var(--light-bg-secondary);
            border-color: var(--light-border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }


        nav.series-menu::-webkit-scrollbar {
            width: 8px;
        }

        nav.series-menu::-webkit-scrollbar-track {
            background: var(--bg-primary);
            border-radius: 10px;
        }
        nav.series-menu::-webkit-scrollbar-thumb {
            background-color: var(--accent-secondary);
            border-radius: 10px;
            border: 2px solid var(--bg-secondary);
        }
        body.light nav.series-menu::-webkit-scrollbar-track {
            background: var(--light-bg-primary);
        }
        body.light nav.series-menu::-webkit-scrollbar-thumb {
            background-color: var(--light-accent-secondary);
            border: 2px solid var(--light-bg-secondary);
        }

        nav.series-menu h2 {
            margin-top: 0;
            color: var(--accent-main);
            font-size: 24px;
            text-align: center;
            border-bottom: 2px solid var(--accent-main);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        body.light nav.series-menu h2 {
            color: var(--light-accent-main);
            border-bottom: 2px solid var(--light-accent-main);
        }

        nav.series-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav.series-menu button.series-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            text-align: left;
            background-color: var(--bg-primary);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease, color 0.2s ease;
            position: relative;
            font-family: 'Roboto Condensed', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        body.light nav.series-menu button.series-btn {
            background-color: var(--light-bg-primary);
            color: var(--light-text-color);
            border-color: var(--light-border-color);
        }

        nav.series-menu button.series-btn:hover {
            background-color: #2b2b2b;
            transform: translateY(-2px);
        }
        body.light nav.series-menu button.series-btn:hover {
            background-color: #e9e9e9;
        }

        nav.series-menu button.series-btn.active {
            background-color: var(--accent-secondary);
            color: white;
            border-color: var(--accent-secondary);
            transform: scale(1.02);
            box-shadow: 0 0 10px var(--accent-secondary);
        }
        body.light nav.series-menu button.series-btn.active {
            background-color: var(--light-accent-secondary);
            border-color: var(--light-accent-secondary);
            box-shadow: 0 0 10px var(--light-accent-secondary);
        }

        .arrow {
            font-size: 1em;
            transition: transform 0.2s ease;
        }

        .series-btn.active .arrow {
            transform: rotate(90deg);
        }

        .sub-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out;
            padding-left: 10px;
        }

        .sub-menu.show {
            max-height: 300px;
            /* Suficiente espacio para las opciones */
            margin-bottom: 10px;
        }

        .sub-menu button {
            width: 100%;
            padding: 10px;
            margin-bottom: 5px;
            text-align: left;
            background-color: #2b2b2b;
            color: #ccc;
            border: none;
            border-left: 2px solid var(--accent-secondary);
            border-radius: 3px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
            font-family: 'Roboto Condensed', sans-serif;
        }
        body.light .sub-menu button {
            background-color: #e9e9e9;
            color: #444;
            border-left: 2px solid var(--light-accent-secondary);
        }

        .sub-menu button:hover {
            background-color: #3e3e3e;
            color: white;
        }
        body.light .sub-menu button:hover {
            background-color: #dcdcdc;
            color: #121212;
        }

        .sub-option-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            margin-bottom: 5px;
        }

        .sub-option-container button {
            width: 100%;
        }
        
        .video-sub-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out;
            padding-left: 15px;
            border-left: 1px solid var(--accent-secondary);
        }
        
        body.light .video-sub-menu {
            border-left: 1px solid var(--light-accent-secondary);
        }
        
        .video-sub-menu.show {
            max-height: 300px;
        }
        
        .video-sub-menu button {
            background-color: #333;
            color: #bbb;
            border-left: none;
        }
        
        body.light .video-sub-menu button {
            background-color: #fafafa;
            color: #555;
        }

        .content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        iframe {
            width: 100%;
            max-width: 960px;
            height: 540px;
            background-color: black;
            border: 3px solid var(--accent-main);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-main);
        }
        body.light iframe {
            border: 3px solid var(--light-accent-main);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2), 0 0 15px var(--light-accent-main);
        }

        .btn {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
            background-color: var(--accent-secondary);
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            font-family: 'Roboto Condensed', sans-serif;
        }
        body.light .btn {
            background-color: var(--light-accent-secondary);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background-color: #6a1a81;
            transform: translateY(-2px);
        }
        body.light .btn:hover {
            background-color: #1a3a5a;
        }

        .section-title {
            width: 100%;
            text-align: center;
            font-size: 26px;
            margin: 10px 0;
            color: var(--accent-main);
            font-family: 'Roboto Condensed', sans-serif;
            border-bottom: 2px solid var(--accent-main);
            padding-bottom: 5px;
        }
        body.light .section-title {
            color: var(--light-accent-main);
            border-bottom: 2px solid var(--light-accent-main);
        }
        
        .episodes-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .episodes-list button.episode-btn {
            padding: 10px 20px;
            background-color: var(--bg-secondary);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            font-family: 'Roboto Condensed', sans-serif;
        }
        body.light .episodes-list button.episode-btn {
            background-color: var(--light-bg-secondary);
            color: var(--light-text-color);
            border-color: var(--light-border-color);
        }

        .episodes-list button.episode-btn:hover {
            background-color: #2b2b2b;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        body.light .episodes-list button.episode-btn:hover {
            background-color: #e9e9e9;
        }

        .episodes-list button.episode-btn.active {
            background-color: var(--accent-secondary);
            color: white;
            border-color: var(--accent-secondary);
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--accent-secondary);
        }
        body.light .episodes-list button.episode-btn.active {
            background-color: var(--light-accent-secondary);
            color: white;
            border-color: var(--light-accent-secondary);
            box-shadow: 0 0 15px var(--light-accent-secondary);
        }
        
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            background-color: var(--bg-secondary);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            cursor: pointer;
            font-size: 1em;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5)
, 0 0 10px var(--accent-main);
            z-index: 1000;
            transition: background 0.3s ease, transform 0.3s ease;
            font-family: 'Roboto Condensed', sans-serif;
        }
        body.light .theme-toggle {
            background-color: var(--light-bg-secondary);
            color: var(--light-text-color);
            border-color: var(--light-accent-main);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.4), 0 0 10px var(--light-accent-main);
        }

        .theme-toggle:hover {
            background-color: #6a1a81;
            /* Azul más oscuro al pasar el ratón */
            transform: scale(1.05);
        }
        body.light .theme-toggle:hover {
            background-color: #1a3a5a;
            /* Morado más oscuro al pasar el ratón */
        }

        @media (max-width: 900px) {
            main {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            nav.series-menu {
                width: 90%;
                margin-bottom: 15px;
            }
            iframe {
                height: 280px;
                max-width: 100%;
            }
            header {
                font-size: 28px;
                padding: 15px;
            }
            #loading-screen {
                font-size: 2.8em;
            }
            .loader {
                width: 60px;
                height: 60px;
                border-width: 8px;
            }
        }

        @media (max-width: 600px) {
            header {
                font-size: 22px;
                letter-spacing: 1px;
            }
            #loading-screen {
                font-size: 2em;
            }
            #skip-loading-btn {
                padding: 10px 20px;
                font-size: 1em;
            }
            main {
                padding: 10px;
            }
            nav.series-menu {
                padding: 10px;
            }
            nav.series-menu h2 {
                font-size: 20px;
            }
            nav.series-menu button.series-btn {
                font-size: 14px;
                padding: 10px;
            }
            iframe {
                height: 220px;
                border-width: 2px;
                border-radius: 10px;
            }
            button.btn {
                padding: 10px 18px;
                font-size: 16px;
            }
            h2.section-title {
                font-size: 22px;
            }
            div.episodes-list button.episode-btn {
                padding: 8px 14px;
                font-size: 13px;
            }
            .theme-toggle {
                padding: 8px 12px;
                font-size: 0.9em;
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>

        const iframe = document.getElementById("tvframe");

        let currentSeries = null;
        let currentEpisodeIndex = null;
        let loadTimeout;
        
        function showMainContent() {
            clearTimeout(loadTimeout);
            loadingScreen.style.opacity = '0';
            document.body.style.overflow = 'auto';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                mainContent.classList.remove("hidden-content");
            }, 700);
        }

        function skipLoading() {
            showMainContent();
        }

        window.addEventListener('load', () => {
            loadTimeout = setTimeout(showMainContent, 2500);
        });

        function cargarSeries() {
            seriesListElem.innerHTML = "";
            Object.keys(seriesData).forEach(serie => {
                const li = document.createElement("li");
                const btn = document.createElement("button");
                btn.textContent = serie;
                btn.className = "series-btn";
                btn.onclick = (e) => {
                    e.stopPropagation();
                    toggleSubMenu(serie);
                };
                
                const arrow = document.createElement("span");
                arrow.className = "arrow";
                arrow.innerHTML = "►";
                btn.appendChild(arrow);

                li.appendChild(btn);

                const subMenu = document.createElement("div");
                subMenu.className = "sub-menu";
                subMenu.id = `sub-menu-${serie.replace(/\s+/g, '-')}`;

                seriesData[serie].options.forEach(option => {
                    const subOptionContainer = document.createElement("div");
                    subOptionContainer.className = "sub-option-container";
                    const subBtn = document.createElement("button");
                    subBtn.textContent = option.title;
                    subBtn.className = option.fontClass;
                    subBtn.onclick = (e) => {
                        e.stopPropagation();
                        toggleVideoSubMenu(serie, option.title, subOptionContainer);
                        seleccionarSerie(serie); 
                    };
                    subOptionContainer.appendChild(subBtn);
                    const videoSubMenu = document.createElement("div");
                    videoSubMenu.className = "video-sub-menu";
                    videoSubMenu.id = `video-sub-menu-${serie.replace(/\s+/g, '-')}-${option.title.replace(/\s+/g, '-')}`;

                    if (seriesData[serie].subOptionVideos && seriesData[serie].subOptionVideos[option.title]) {
                        seriesData[serie].subOptionVideos[option.title].forEach(video => {
                            const videoBtn = document.createElement("button");
                            videoBtn.textContent = video.title;
 
                            videoBtn.onclick = (e) => {
                                e.stopPropagation();
                                cargarEpisodioURL(video.url, video.title);
                            };
                            videoSubMenu.appendChild(videoBtn);
                        });
                    }
                    subOptionContainer.appendChild(videoSubMenu);
                    subMenu.appendChild(subOptionContainer);
                });

                li.appendChild(subMenu);
                seriesListElem.appendChild(li);
            });
        }

        function toggleSubMenu(serie) {
            const subMenuId = `sub-menu-${serie.replace(/\s+/g, '-')}`;
            const subMenu = document.getElementById(subMenuId);
            const seriesBtn = subMenu.previousElementSibling;

            const allSubMenus = document.querySelectorAll(".sub-menu");
            allSubMenus.forEach(menu => {
                if (menu.id !== subMenuId) {
                    menu.classList.remove("show");
                    menu.previousElementSibling.classList.remove("active");
                    const videoSubMenus = menu.querySelectorAll(".video-sub-menu");
                    videoSubMenus.forEach(vsm => vsm.classList.remove("show"));
                }
            });
            subMenu.classList.toggle("show");
            seriesBtn.classList.toggle("active");

            if (subMenu.classList.contains("show")) {
                 seleccionarSerie(serie);
            }
        }
        
        function toggleVideoSubMenu(serie, optionTitle, parentContainer) {
            const videoSubMenuId = `video-sub-menu-${serie.replace(/\s+/g, '-')}-${optionTitle.replace(/\s+/g, '-')}`;
            const videoSubMenu = document.getElementById(videoSubMenuId);

            const allVideoSubMenus = parentContainer.parentNode.querySelectorAll(".video-sub-menu");
            allVideoSubMenus.forEach(menu => {
                if (menu.id !== videoSubMenuId) {
                    menu.classList.remove("show");
                }
            });
            videoSubMenu.classList.toggle("show");
        }


        function selectSubOption(optionTitle) {
            console.log(`Seleccionaste la opción: ${optionTitle}`);
        }

        function seleccionarSerie(serie) {
            currentSeries = serie;
            currentEpisodeIndex = 0;
            mostrarEpisodios(serie);
            actualizarSeriesActivas();
        }

        function actualizarSeriesActivas() {
            const buttons = seriesListElem.querySelectorAll("button.series-btn");
            buttons.forEach(btn => {
                btn.classList.toggle("active", btn.textContent.trim().startsWith(currentSeries));
            });
        }

        function mostrarEpisodios(serie) {
            episodesListElem.innerHTML = "";
            episodesTitle.textContent = `📺 Episodios - ${serie}`;
            seriesData[serie].episodes.forEach((ep, idx) => {
                const btn = document.createElement("button");
                btn.textContent = ep.title;
                btn.className = "episode-btn";
                btn.onclick = () => cargarEpisodio(idx);
                
                episodesListElem.appendChild(btn);
            });
            actualizarEpisodiosActivos();
        }

        function actualizarEpisodiosActivos() {
            const buttons = episodesListElem.querySelectorAll("button.episode-btn");
            buttons.forEach((btn, idx) => {
                btn.classList.toggle("active", idx === currentEpisodeIndex);
            });
        }

        function cargarEpisodio(index) {
            currentEpisodeIndex = index;
            const ep = seriesData[currentSeries].episodes[index];
            iframe.src = ep.url;
            actualizarEpisodiosActivos();
            guardarEnLocalStorage();
        }

        function cargarEpisodioURL(url, title) {
            iframe.src = url;
            episodesTitle.textContent = `▶️ ${title}`;
            const activeEpisodeBtn = episodesListElem.querySelector(".episode-btn.active");
            if (activeEpisodeBtn) {
                activeEpisodeBtn.classList.remove("active");
            }
            guardarEnLocalStorage(url);
        }


        function pantallaCompleta() {
            if (iframe.requestFullscreen) iframe.requestFullscreen();
            else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
            else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
        }

        function toggleTheme() {
            document.body.classList.toggle("light");
        }

        function guardarEnLocalStorage(customUrl = null) {
            if (customUrl) {
                localStorage.setItem("lastPlayedUrl", customUrl);
                localStorage.removeItem("lastSeries");
                localStorage.removeItem("lastEpisode");
            } else {
                localStorage.setItem("lastSeries", currentSeries);
                localStorage.setItem("lastEpisode", currentEpisodeIndex);
                localStorage.removeItem("lastPlayedUrl");
            }
        }

        function cargarDesdeLocalStorage() {
            const savedUrl = localStorage.getItem("lastPlayedUrl");
            if (savedUrl) {
                cargarEpisodioURL(savedUrl, "Último video visto");
                const activeSeriesBtn = seriesListElem.querySelector(".series-btn.active");
                if (activeSeriesBtn) activeSeriesBtn.classList.remove("active");
                const activeSubMenu = seriesListElem.querySelector(".sub-menu.show");
                if (activeSubMenu) activeSubMenu.classList.remove("show");
                const activeVideoSubMenu = seriesListElem.querySelector(".video-sub-menu.show");
                if (activeVideoSubMenu) activeVideoSubMenu.classList.remove("show");

                return;
            }

            const savedSeries = localStorage.getItem("lastSeries");
            const savedEpisode = localStorage.getItem("lastEpisode");
            
            if (savedSeries && seriesData[savedSeries]) {
                currentSeries = savedSeries;
                currentEpisodeIndex = savedEpisode !== null ? Number(savedEpisode) : 0;
                actualizarSeriesActivas();
                mostrarEpisodios(currentSeries);
                cargarEpisodio(currentEpisodeIndex);
            } else {
                const firstSerie = Object.keys(seriesData)[0];
                seleccionarSerie(firstSerie);
            }
        }

        cargarSeries();
        cargarDesdeLocalStorage();
    </script>
</body>
</html>
